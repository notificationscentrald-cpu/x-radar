name: x-radar
on:
  schedule:
    - cron: "7 * * * *"     # щогодини: нові гарячі пости
    - cron: "0 6 * * *"     # 06:00 UTC = 09:00 Київ: ранковий топ за добу
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: x-radar
jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run radar
        env:
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "${{ github.event.schedule }}" = "0 6 * * *" ]; then
            python radar.py --digest
          else
            python radar.py
          fi
      - name: Save state
        run: |
          git config user.name "x-radar"
          git config user.email "x-radar@users.noreply.github.com"
          git add state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "radar state" && git push)
