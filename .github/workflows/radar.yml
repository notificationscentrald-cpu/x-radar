name: x-radar
on:
  schedule:
    - cron: "7 */2 * * *"   # кожні 2 години: нові гарячі пости
    - cron: "0 6 * * *"     # 06:00 UTC = 09:00 Київ: ранковий топ за добу
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: x-radar
jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # завжди свіжий state.json, а не версія на момент запуску
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run radar
        env:
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "${{ github.event.schedule }}" = "0 6 * * *" ]; then
            python radar.py --digest
          else
            python radar.py
          fi
      - name: Save state
        run: |
          git config user.name "x-radar"
          git config user.email "x-radar@users.noreply.github.com"
          git add state.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "radar state"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && exit 0; sleep 5; done
          exit 1
